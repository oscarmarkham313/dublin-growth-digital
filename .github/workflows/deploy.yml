name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Without these, components/Analytics.tsx falls back to empty
          # strings and BOTH trackers are silently skipped — which is
          # exactly what happened from launch until 9 Sep 2026, so the
          # site ran with no measurement at all while ads were spending.
          #
          # The pixel id is public (it appears in the page source), so it
          # lives here rather than in a secret. GA4 comes from a repo
          # variable: add NEXT_PUBLIC_GA4_ID under Settings -> Secrets and
          # variables -> Actions -> Variables and it starts working on the
          # next deploy, with no code change.
          #
          # Both are still gated behind consent at runtime — see
          # components/ConsentBanner.tsx.
          NEXT_PUBLIC_META_PIXEL_ID: "1618086275952154"
          NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # The legacy branch-deploy pipeline can hold the deployment lock and
      # make the first attempt fail. Wait for it to clear and try once more.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # The legacy branch-deploy pipeline races this workflow and can land
      # last, reverting the site to the old files at the repo root. Deploy
      # once more after it has definitely finished so we always win.
      - run: sleep 120
      - id: deployment-final
        uses: actions/deploy-pages@v4
